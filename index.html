<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AR1: 硬件解剖与坐标系交付版</title>
    
   <meta http-equiv="Content-Security-Policy" content="
    default-src * 'unsafe-inline' 'unsafe-eval';
    script-src * 'unsafe-inline' 'unsafe-eval';
    connect-src * 'unsafe-inline';
    img-src * data: blob: 'unsafe-inline';
    frame-src *;
    style-src * 'unsafe-inline';
    worker-src * data: blob: 'unsafe-inline' 'unsafe-eval';
    child-src * data: blob: 'unsafe-inline' 'unsafe-eval';
    ">

    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
</head>

<body style="margin: 0px; overflow: hidden; background-color: #000;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;">
        
        <a-assets>
            <a-asset-item id="dobot" src="assets/dobot_arm.glb"></a-asset-item>
        </a-assets>

        <a-marker type="pattern" url="markers/pattern-AR1.patt" smooth="true">
            
            <a-sphere radius="0.1" position="0 0.5 0" color="yellow" opacity="0.8"></a-sphere>

            <a-entity id="model-container" scale="0.8 0.8 0.8" position="0 0 0" rotation="-90 0 0">
                
                <a-entity gltf-model="#dobot"></a-entity>

                <a-entity animation="property: rotation; from: 0 -90 0; to: 0 90 0; dur: 4000; dir: alternate; loop: true; easing: easeInOutSine">
                    <a-text value="J1: Base Rotation (-90 to +90)" position="0 1.5 0" align="center" color="#FFF" scale="0.4 0.4 0.4"></a-text>
                </a-entity>

                <a-plane position="1.5 0.5 0" width="1.8" height="0.8" color="#111" opacity="0.8" rotation="0 -30 0">
                    <a-text value="Specs:\nPayload: 500g\nPrecision: 0.2mm\nReach: 320mm" align="left" position="-0.8 0 0" color="#00FF00" scale="0.3 0.3 0.3"></a-text>
                </a-plane>
            </a-entity>

            <a-entity id="coordinate-system" scale="0 0 0" animation="property: scale; to: 1.5 1.5 1.5; delay: 1500; dur: 800; easing: easeOutElastic">
                <a-entity line="start: 0 0 0; end: 1 0 0; color: #FF3333"></a-entity>
                <a-text value="X" position="1.1 0 0" color="#FF3333" rotation="-90 0 0" scale="0.5 0.5 0.5" align="center"></a-text>
                
                <a-entity line="start: 0 0 0; end: 0 1 0; color: #33FF33"></a-entity>
                <a-text value="Y" position="0 1.1 0" color="#33FF33" rotation="-90 0 0" scale="0.5 0.5 0.5" align="center"></a-text>
                
                <a-entity line="start: 0 0 0; end: 0 0 1; color: #3333FF"></a-entity>
                <a-text value="Z" position="0 0 1.1" color="#3333FF" rotation="-90 0 0" scale="0.5 0.5 0.5" align="center"></a-text>
            </a-entity>

        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
