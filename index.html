<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Security-Policy" content="
    script-src 'self' 'unsafe-eval' 'unsafe-inline' https://aframe.io https://raw.githack.com https://cdn.jsdelivr.net; 
    style-src 'self' 'unsafe-inline'; 
    font-src 'self';">
    <meta charset="utf-8">
    <title>AR1: 硬件解剖与坐标系</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
</head>

<body style="margin: 0px; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        
        <a-assets>
            <a-asset-item id="dobot" src="assets/dobot_arm.glb"></a-asset-item>
        </a-assets>

        <a-marker type="pattern" url="markers/pattern-AR1.patt">
            <a-entity id="model" gltf-model="#dobot" scale="0 0 0" rotation="-90 0 0"
                animation="property: scale; to: 0.5 0.5 0.5; dur: 1000; easing: easeOutElastic">
                
                <a-entity animation="property: rotation; from: 0 0 0; to: 0 0 180; dur: 3000; dir: alternate; loop: true; easing: easeInOutSine">
                    
                    <a-text value="J1: Base Rotation" position="0 0.5 0" align="center" color="#FFF" scale="0.3 0.3 0.3" rotation="90 0 0"></a-text>
                    
                    <a-plane position="0.8 0 0" width="0.6" height="0.4" color="#000" opacity="0.7" rotation="90 0 0">
                        <a-text value="Payload: 500g\nPrecision: 0.2mm\nReach: 320mm" align="center" color="#00FF00" scale="0.2 0.2 0.2"></a-text>
                    </a-plane>
                </a-entity>
            </a-entity>

            <a-entity id="axes" scale="0 0 0" animation="property: scale; to: 1 1 1; delay: 2000; dur: 1000">
                <a-entity line="start: 0 0 0; end: 0.8 0 0; color: red"></a-entity> <a-text value="X" position="0.9 0 0" color="red" rotation="-90 0 0" scale="0.3 0.3 0.3"></a-text>
                
                <a-entity line="start: 0 0 0; end: 0 0.8 0; color: green"></a-entity> <a-text value="Y" position="0 0.9 0" color="green" rotation="-90 0 0" scale="0.3 0.3 0.3"></a-text>
                
                <a-entity line="start: 0 0 0; end: 0 0 0.8; color: blue"></a-entity> <a-text value="Z" position="0 0 0.9" color="blue" rotation="-90 0 0" scale="0.3 0.3 0.3"></a-text>
            </a-entity>
        </a-marker>

        <a-entity camera></a-entity>
        
    </a-scene>
</body>
</html>
